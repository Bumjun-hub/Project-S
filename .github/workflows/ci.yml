name: Project S 자동 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-s-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프론트엔드 테스트 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PROJECT_S_E2E: '0'
      NEXT_PUBLIC_DEMO_MODE: 'false'
      NEXT_PUBLIC_API_BASE_URL: ''
      SERVER_API_BASE_URL: ''
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js 설치 및 npm 캐시 설정
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 잠금 파일 기준 의존성 설치
        run: npm ci
      - name: 프론트엔드 단위 테스트
        run: npm run test:unit
      - name: 프론트엔드 프로덕션 빌드
        run: npm run build
      - name: TypeScript 타입 검사
        run: npx tsc --noEmit
      - name: Chromium 및 Linux 실행 의존성 설치
        run: npx playwright install --with-deps chromium
      - name: 데모 환경 브라우저 자동 테스트
        run: npm run test:e2e
      - name: 브라우저 테스트 보고서 업로드
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  backend:
    name: 백엔드 테스트 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Java 설치 및 Gradle 캐시 설정
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: 백엔드 테스트 및 실행 JAR 빌드
        run: ./gradlew --no-daemon build
      - name: 백엔드 테스트 보고서 업로드
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: warn
