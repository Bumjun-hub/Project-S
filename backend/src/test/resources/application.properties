spring.datasource.url=jdbc:h2:mem:project_s_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.profiles.active=test
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
jwt.secret=project-s-test-jwt-secret-key-for-provider-tests
jwt.access-token-expiration-millis=3600000
