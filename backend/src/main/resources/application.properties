spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_s}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Create and update local development tables from JPA entities.
spring.jpa.hibernate.ddl-auto=update
# Close database work inside transactions instead of keeping persistence context open during web rendering.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
