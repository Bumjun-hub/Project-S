spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_s}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Keep schema management disabled until real entities and migrations are introduced.
spring.jpa.hibernate.ddl-auto=none
# Use the PostgreSQL dialect explicitly so Hibernate does not need a live DB just to infer it.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Close database work inside transactions instead of keeping persistence context open during web rendering.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
